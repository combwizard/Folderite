name: pages

# Publishes combwizard.github.io/Folderite: the landing page from site/ at the root and the
# documentation (docs/ + mkdocs.yml) under /docs/.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "docs-theme/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  # Pull requests only build the docs (strict: broken links and anchors fail), they don't deploy.
  pull_request:
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Stage landing page
        shell: pwsh
        run: ./site/stage.ps1 -Out _site

      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict -d "$GITHUB_WORKSPACE/_site/docs"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
